<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melhores Vídeos - Nathan Superior Web</title>
    
    <style>
        /* Adicionando zoom de 110% para todo o documento */
        body {
            zoom: 110%;
            -moz-transform: scale(1.1);
            -moz-transform-origin: 0 0;
        }
        
        /* Para outros navegadores */
        @media all and (-webkit-min-device-pixel-ratio:0) {
            body {
                zoom: 110%;
            }
        }
    </style>
    
    <script>
        (function() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
            }
            
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                document.body.classList.add('logged-in');
            }
        })();
    </script>
    
    <style>
        :root {
            --verde: #27ae60;
            --azul: #3498db;
            --vermelho: #e74c3c;
            --amarelo: #f1c40f;
            --texto: #f0f0f0;
            --fundo: #000000;
            --card: #0a0a0a;
            --borda: #222;
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
            --categoria-1: #9b59b6;
            --categoria-2: #1abc9c;
            --categoria-3: #e67e22;
            --categoria-4: #e74c3c;
        }

        .dark-mode {
            --verde: #1e8449;
            --azul: #2980b9;
            --vermelho: #ff6b6b;
            --amarelo: #f39c12;
            --texto: #f0f0f0;
            --fundo: #000000;
            --card: #0a0a0a;
            --borda: #222;
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
            --categoria-1: #8e44ad;
            --categoria-2: #16a085;
            --categoria-3: #d35400;
            --categoria-4: #c0392b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--fundo);
            color: var(--texto);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animação de bolinhas neon no fundo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: -1;
            pointer-events: none;
        }

        .neon-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.7;
            filter: blur(8px);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translate(30px, -40px) scale(1.1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-20px, 30px) scale(0.9);
                opacity: 0.7;
            }
            75% {
                transform: translate(40px, 20px) scale(1.2);
                opacity: 0.4;
            }
        }

        /* NAVBAR COM TEMA NEON */
        .navbar {
            background: rgba(10, 10, 10, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .logo {
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 5px var(--neon-ciano), 0 0 10px var(--neon-ciano);
        }

        .logo small {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: normal;
        }

        #theme-toggle {
            color: var(--neon-ciano);
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        #theme-toggle:hover {
            transform: scale(1.2);
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-ciano);
        }

        .search-bar {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 15px;
            border: 1px solid var(--neon-ciano);
            border-radius: 20px;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--texto);
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .search-bar input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .nav-icons {
            display: flex;
            gap: 20px;
        }

        .nav-icon {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .nav-icon:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-ciano);
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: var(--neon-ciano);
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .logout-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        body.logged-in .user-info {
            display: flex;
        }

        body.logged-in .login-btn-nav {
            display: none;
        }

        /* CONTEÚDO DA PÁGINA DE VÍDEOS */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .page-title {
            color: var(--neon-ciano);
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5rem;
            position: relative;
            display: inline-block;
            width: 100%;
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .page-title::after {
            content: '';
            display: block;
            width: 200px;
            height: 4px;
            background: var(--neon-ciano);
            margin: 15px auto;
            box-shadow: 0 0 10px var(--neon-ciano);
        }

        /* CATEGORIAS */
        .categorias-container {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .categoria-btn {
            padding: 12px 25px;
            border: 2px solid var(--neon-ciano);
            background: transparent;
            color: var(--neon-ciano);
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .categoria-btn:hover {
            background: rgba(0, 255, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 0 15px var(--neon-ciano);
        }

        .categoria-btn.active {
            background: var(--neon-ciano);
            color: black;
            font-weight: bold;
            box-shadow: 0 0 15px var(--neon-ciano);
        }

        .categoria-btn[data-categoria="todos"] {
            border-color: var(--neon-ciano);
        }

        .categoria-btn[data-categoria="minecraft"] {
            border-color: var(--categoria-1);
            color: var(--categoria-1);
        }

        .categoria-btn[data-categoria="minecraft"].active {
            background: var(--categoria-1);
            color: white;
        }

        .categoria-btn[data-categoria="insaniacraft"] {
            border-color: var(--categoria-2);
            color: var(--categoria-2);
        }

        .categoria-btn[data-categoria="insaniacraft"].active {
            background: var(--categoria-2);
            color: white;
        }

        .categoria-btn[data-categoria="pessoal"] {
            border-color: var(--categoria-3);
            color: var(--categoria-3);
        }

        .categoria-btn[data-categoria="pessoal"].active {
            background: var(--categoria-3);
            color: white;
        }

        .categoria-btn[data-categoria="exclusivo"] {
            border-color: var(--categoria-4);
            color: var(--categoria-4);
        }

        .categoria-btn[data-categoria="exclusivo"].active {
            background: var(--categoria-4);
            color: white;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .video-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            border: 1px solid var(--neon-ciano);
            opacity: 1;
            transform: translateY(0);
        }

        .video-card.hidden {
            display: none;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 15px var(--neon-ciano);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            padding: 20px;
        }

        .video-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--neon-ciano);
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .video-stats {
            display: flex;
            justify-content: space-between;
            color: var(--texto);
            font-size: 0.95rem;
        }

        .video-likes {
            color: var(--neon-marinho);
        }

        .video-views {
            color: var(--neon-ciano);
        }

        .video-stats i {
            text-shadow: 0 0 5px currentColor;
        }

        .video-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 2;
            border: 1px solid;
            box-shadow: 0 0 5px;
        }

        .tag-minecraft {
            background: rgba(155, 89, 182, 0.9);
            color: white;
            border-color: var(--categoria-1);
            box-shadow: 0 0 10px var(--categoria-1);
        }

        .tag-insaniacraft {
            background: rgba(26, 188, 156, 0.9);
            color: white;
            border-color: var(--categoria-2);
            box-shadow: 0 0 10px var(--categoria-2);
        }

        .tag-pessoal {
            background: rgba(230, 126, 34, 0.9);
            color: white;
            border-color: var(--categoria-3);
            box-shadow: 0 0 10px var(--categoria-3);
        }

        .tag-exclusivo {
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border-color: var(--categoria-4);
            box-shadow: 0 0 10px var(--categoria-4);
        }

        .section-divider {
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--neon-ciano), transparent);
            margin: 40px 0;
            box-shadow: 0 0 10px var(--neon-ciano);
        }

        .featured-video {
            grid-column: 1 / -1;
            margin-bottom: 30px;
        }

        .featured-video .video-container {
            padding-bottom: 40%; /* Mais largo que os outros */
        }

        .featured-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--vermelho);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 2;
            box-shadow: 0 0 10px var(--vermelho);
            border: 1px solid var(--neon-ciano);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--texto);
            opacity: 0.7;
            font-size: 1.2rem;
            background: var(--card);
            border-radius: 15px;
            border: 1px solid var(--borda);
        }

        .no-results i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--neon-ciano);
            display: block;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: var(--texto);
            opacity: 0.8;
            background: var(--card);
            border-top: 1px solid var(--borda);
            margin-top: 50px;
        }

        /* MODAL DE LOGIN COM TEMA NEON */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background-color: var(--card);
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 15px var(--neon-ciano), 0 0 30px var(--neon-azul);
            position: relative;
            border: 1px solid var(--neon-ciano);
        }

        .close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--vermelho);
            text-shadow: 0 0 5px var(--vermelho);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--neon-ciano);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--neon-ciano);
            border-radius: 5px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--texto);
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-ciano);
        }

        .modal-btn {
            background: var(--neon-marinho);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 5px var(--neon-marinho);
            transition: all 0.3s;
        }

        .modal-btn:hover {
            background: #0066aa;
            box-shadow: 0 0 10px var(--neon-marinho), 0 0 20px var(--neon-azul);
        }

        .switch-form {
            text-align: center;
            margin-top: 15px;
        }

        .switch-btn {
            background: none;
            border: none;
            color: var(--neon-ciano);
            cursor: pointer;
            text-decoration: underline;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }
        
        .success {
            background-color: rgba(39, 174, 96, 0.2);
            color: var(--verde);
            border: 1px solid var(--verde);
            box-shadow: 0 0 5px var(--verde);
        }
        
        .error {
            background-color: rgba(231, 76, 60, 0.2);
            color: var(--vermelho);
            border: 1px solid var(--vermelho);
            box-shadow: 0 0 5px var(--vermelho);
        }

        /* Coração de favoritos */
        .favorite-heart {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card:hover .favorite-heart {
            opacity: 0.8;
        }

        .favorite-heart:hover {
            opacity: 1 !important;
            transform: scale(1.2);
        }

        .favorite-heart.favorited {
            color: var(--vermelho);
            opacity: 1 !important;
            text-shadow: 0 0 10px var(--vermelho);
        }

        .logged-in .favorite-heart {
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
                padding: 15px;
            }
            .search-bar {
                order: 3;
                width: 100%;
                margin: 15px 0 0 0;
            }
            .container {
                padding: 15px;
            }
            .videos-grid {
                grid-template-columns: 1fr;
            }
            .featured-video {
                grid-column: 1;
            }
            .featured-video .video-container {
                padding-bottom: 56.25%;
            }
            .categorias-container {
                justify-content: center;
            }
            .categoria-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Modal de Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            
            <div id="loginForm">
                <h2 style="color: var(--neon-ciano); margin-bottom: 20px; text-align: center; text-shadow: 0 0 5px var(--neon-ciano);">Entrar</h2>
                
                <form id="login">
                    <div class="form-group">
                        <label for="loginUsername"><i class="fas fa-user"></i> Nome de Usuário</label>
                        <input type="text" id="loginUsername" placeholder="Seu nome de usuário" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword"><i class="fas fa-lock"></i> Senha</label>
                        <input type="password" id="loginPassword" placeholder="Sua senha" required>
                    </div>
                    
                    <button type="submit" class="modal-btn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                    
                    <div id="loginMessage" class="status-message" style="display: none;"></div>
                </form>
                
                <div class="switch-form">
                    <span>Não tem uma conta? </span>
                    <button class="switch-btn" id="showRegister">Registre-se</button>
                </div>
            </div>
            
            <div id="registerForm" style="display: none;">
                <h2 style="color: var(--neon-ciano); margin-bottom: 20px; text-align: center; text-shadow: 0 0 5px var(--neon-ciano);">Criar Conta</h2>
                
                <form id="register">
                    <div class="form-group">
                        <label for="registerUsername"><i class="fas fa-user-edit"></i> Nome de Usuário</label>
                        <input type="text" id="registerUsername" placeholder="Escolha um nome de usuário" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="registerPassword"><i class="fas fa-key"></i> Senha</label>
                        <input type="password" id="registerPassword" placeholder="Crie uma senha" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-check-circle"></i> Confirmar Senha</label>
                        <input type="password" id="confirmPassword" placeholder="Digite a senha novamente" required>
                    </div>
                    
                    <button type="submit" class="modal-btn"><i class="fas fa-user-plus"></i> Registrar</button>
                    
                    <div id="registerMessage" class="status-message" style="display: none;"></div>
                </form>
                
                <div class="switch-form">
                    <span>Já tem uma conta? </span>
                    <button class="switch-btn" id="showLogin">Faça login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i id="theme-toggle" class="fas fa-star" title="Mudar tema"></i>
            <span>Nathan Superior Web <small>- Melhores Vídeos</small></span>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquise por spoilers, vídeos...">
        </div>
        
        <div class="nav-icons">
            <a href="index.html" class="nav-icon" title="Início">
                <i class="fas fa-home"></i>
            </a>
            <a href="favoritos.html" class="nav-icon" title="Favoritos">
                <i class="fas fa-heart"></i>
            </a>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <button class="logout-btn" id="logoutBtn">Sair</button>
            </div>
            <button class="nav-icon login-btn-nav" id="loginBtnNav" title="Login">
                <i class="fas fa-user"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Os Vídeos Mais Populares do Canal</h1>
        
        <!-- Categorias -->
        <div class="categorias-container">
            <button class="categoria-btn active" data-categoria="todos">
                <i class="fas fa-globe"></i> Todos
            </button>
            <button class="categoria-btn" data-categoria="minecraft">
                <i class="fas fa-cube"></i> Minecraft
            </button>
            <button class="categoria-btn" data-categoria="insaniacraft">
                <i class="fas fa-gamepad"></i> InsaniaCraft
            </button>
            <button class="categoria-btn" data-categoria="pessoal">
                <i class="fas fa-user"></i> Pessoal
            </button>
            <button class="categoria-btn" data-categoria="exclusivo">
                <i class="fas fa-star"></i> Exclusivos
            </button>
        </div>
        
        <div class="videos-grid" id="videosGrid">
            <!-- Vídeos serão gerados dinamicamente via JavaScript -->
        </div>
    </div>

    <div class="footer">
        <p>Site oficial desenvolvido por Nathan • Todos os direitos reservados • Atualizado em <span id="current-date"></span></p>
    </div>

    <script>
        // Elementos do DOM
        const themeToggle = document.getElementById('theme-toggle');
        const loginModal = document.getElementById('loginModal');
        const loginBtnNav = document.getElementById('loginBtnNav');
        const closeBtn = document.querySelector('.close');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginSubmit = document.getElementById('login');
        const registerSubmit = document.getElementById('register');
        const loginMessage = document.getElementById('loginMessage');
        const registerMessage = document.getElementById('registerMessage');
        const logoutBtn = document.getElementById('logoutBtn');
        const userAvatar = document.getElementById('userAvatar');
        const searchInput = document.getElementById('searchInput');
        const videosGrid = document.getElementById('videosGrid');
        const categoriaBtns = document.querySelectorAll('.categoria-btn');

        // Dados dos vídeos
        const videos = [
            // Minecraft Elementos (ATUALIZADO)
            {
                id: 1,
                titulo: "Série nova!!! Minecraft elementos o inicio de tudo",
                url: "https://www.youtube.com/embed/iPUQoKibauo",
                videoUrl: "https://youtu.be/iPUQoKibauo",
                views: "3.514", // ATUALIZADO
                likes: "162", // ATUALIZADO
                categoria: "minecraft",
                tag: "tag-minecraft",
                featured: true
            },
            
            // InsaniaCraft
            {
                id: 2,
                titulo: "InsaniaCraft: O MELHOR COMEÇO Produtivo! (EP.1)",
                url: "https://www.youtube.com/embed/FPGAVhG8FoU",
                videoUrl: "https://youtu.be/FPGAVhG8FoU",
                views: "119",
                likes: "12",
                categoria: "insaniacraft",
                tag: "tag-insaniacraft",
                featured: false
            },
            
            // Pessoal
            {
                id: 3,
                titulo: "O PORQUÊ EU SAI DA LUNÁTICOS...",
                url: "https://www.youtube.com/embed/3RMBjtrklD0",
                videoUrl: "https://youtu.be/3RMBjtrklD0",
                views: "115",
                likes: "15",
                categoria: "pessoal",
                tag: "tag-pessoal",
                featured: false
            },
            
            // InsaniaCraft
            {
                id: 4,
                titulo: "DESAFIO: VIRAR PREFEITO NO InsaniaCraft EM 24 HORAS! (Será que Consigo?)",
                url: "https://www.youtube.com/embed/58cKTox-L68",
                videoUrl: "https://youtu.be/58cKTox-L68",
                views: "50",
                likes: "9",
                categoria: "insaniacraft",
                tag: "tag-insaniacraft",
                featured: false
            },
            
            // Exclusivo (NOVO)
            {
                id: 5,
                titulo: "Sinto sua falta jassy...",
                url: "https://www.youtube.com/embed/l7ZS5LetDig",
                videoUrl: "https://youtu.be/l7ZS5LetDig",
                views: "Indeterminado",
                likes: "3",
                categoria: "exclusivo",
                tag: "tag-exclusivo",
                featured: false,
                descricao: "Exclusivo 100% no site - Liberado no canal dia sim e dia não"
            },
            
            // InsaniaCraft (NOVO)
            {
                id: 6,
                titulo: "Eu Revelo o SEGREDO do Servidor Insaniacraft!",
                url: "https://www.youtube.com/embed/Mt2OVeeQFWs",
                videoUrl: "https://youtu.be/Mt2OVeeQFWs",
                views: "51",
                likes: "10",
                categoria: "insaniacraft",
                tag: "tag-insaniacraft",
                featured: false
            },
            
            // Pessoal (NOVO)
            {
                id: 7,
                titulo: "Obrigado pessoal...",
                url: "https://www.youtube.com/embed/M67JDk9xr4g",
                videoUrl: "https://youtu.be/M67JDk9xr4g",
                views: "143",
                likes: "18",
                categoria: "pessoal",
                tag: "tag-pessoal",
                featured: false
            }
        ];

        let categoriaAtiva = 'todos';

        // Criar bolinhas neon no fundo
        function createNeonCircles() {
            const colors = ['var(--neon-ciano)', 'var(--neon-azul)', 'var(--neon-marinho)'];
            const body = document.body;
            
            // Remover bolinhas existentes (se houver)
            document.querySelectorAll('.neon-circle').forEach(el => el.remove());
            
            // Criar 15 bolinhas
            for (let i = 0; i < 15; i++) {
                const circle = document.createElement('div');
                circle.classList.add('neon-circle');
                
                // Tamanho aleatório entre 20 e 100px
                const size = Math.random() * 80 + 20;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                
                // Posição aleatória
                circle.style.left = `${Math.random() * 100}vw`;
                circle.style.top = `${Math.random() * 100}vh`;
                
                // Cor aleatória
                circle.style.background = colors[Math.floor(Math.random() * colors.length)];
                circle.style.boxShadow = `0 0 15px ${circle.style.background}, 0 0 30px ${circle.style.background}`;
                
                // Atraso aleatório na animação
                circle.style.animationDelay = `${Math.random() * 5}s`;
                circle.style.animationDuration = `${15 + Math.random() * 10}s`;
                
                body.appendChild(circle);
            }
        }

        // Verifica se o usuário está logado ao carregar a página
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const username = localStorage.getItem('currentUser');
            
            if (isLoggedIn && username) {
                document.body.classList.add('logged-in');
                userAvatar.textContent = username.charAt(0).toUpperCase();
            }
        }

        // Aplica o tema salvo no localStorage
        function applyTheme() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            document.documentElement.classList.toggle('dark-mode', isDark);
            themeToggle.style.color = isDark ? '#f39c12' : '#f1c40f';
        }
        
        // Evento de clique no botão de tema
        themeToggle.addEventListener('click', () => {
            const isDark = !document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            
            themeToggle.style.transform = 'rotate(360deg) scale(1.2)';
            setTimeout(() => {
                themeToggle.style.transform = '';
            }, 300);
            
            applyTheme();
        });

        // Abrir modal de login
        loginBtnNav.addEventListener('click', () => {
            loginModal.style.display = 'block';
        });

        // Fechar modal de login
        closeBtn.addEventListener('click', () => {
            loginModal.style.display = 'none';
        });

        // Fechar modal ao clicar fora
        window.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                loginModal.style.display = 'none';
            }
        });

        // Alternar entre login e registro
        showRegister.addEventListener('click', () => {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        });

        showLogin.addEventListener('click', () => {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
        });

        // Sistema de registro (usando apenas localStorage)
        registerSubmit.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validações
            if (password !== confirmPassword) {
                showMessage(registerMessage, "As senhas não coincidem!", 'error');
                return;
            }

            if (password.length < 4) {
                showMessage(registerMessage, "A senha deve ter pelo menos 4 caracteres!", 'error');
                return;
            }

            // Salva no localStorage
            const usuarios = JSON.parse(localStorage.getItem('usuarios_magicos') || '[]');
            
            // Verifica se usuário já existe
            if (usuarios.some(u => u.username === username)) {
                showMessage(registerMessage, "Este usuário já existe!", 'error');
                return;
            }
            
            usuarios.push({ username, password });
            localStorage.setItem('usuarios_magicos', JSON.stringify(usuarios));
            
            showMessage(registerMessage, "Conta criada com sucesso!", 'success');
            
            // Limpa o formulário
            this.reset();
            
            // Volta para o login após 2 segundos
            setTimeout(() => {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
                registerMessage.style.display = 'none';
            }, 2000);
        });

        // Sistema de login (usando localStorage)
        loginSubmit.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            const usuarios = JSON.parse(localStorage.getItem('usuarios_magicos') || []);
            const user = usuarios.find(u => u.username === username && u.password === password);
            
            if (user) {
                showMessage(loginMessage, "Login bem-sucedido!", 'success');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', username);
                
                setTimeout(() => {
                    loginModal.style.display = 'none';
                    checkLoginStatus();
                    updateFavoriteHearts();
                }, 1000);
            } else {
                showMessage(loginMessage, "Usuário ou senha incorretos!", 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.setItem('isLoggedIn', 'false');
            localStorage.removeItem('currentUser');
            document.body.classList.remove('logged-in');
            updateFavoriteHearts();
        });

        // Função para mostrar mensagens
        function showMessage(element, text, type) {
            element.textContent = text;
            element.style.display = 'block';
            element.className = `status-message ${type}`;
        }

        // Renderizar vídeos
        function renderVideos(videosParaRenderizar) {
            videosGrid.innerHTML = '';
            
            if (videosParaRenderizar.length === 0) {
                videosGrid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>Nenhum vídeo encontrado</h3>
                        <p>Tente ajustar sua busca ou selecione outra categoria</p>
                    </div>
                `;
                return;
            }
            
            videosParaRenderizar.forEach((video, index) => {
                const isFeatured = video.featured && categoriaAtiva === 'todos';
                const videoCard = document.createElement('div');
                videoCard.className = `video-card ${isFeatured ? 'featured-video' : ''}`;
                
                videoCard.innerHTML = `
                    <div class="video-container">
                        ${video.descricao ? `<span class="featured-label">🎬 ${video.descricao}</span>` : ''}
                        ${isFeatured ? '<span class="featured-label">🔥 Mais Popular</span>' : ''}
                        <span class="video-tag ${video.tag}">${video.categoria.toUpperCase()}</span>
                        <i class="fas fa-heart favorite-heart" data-video-url="${video.videoUrl}"></i>
                        <iframe src="${video.url}" 
                                title="YouTube video player" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen></iframe>
                    </div>
                    <div class="video-info">
                        <h3 class="video-title">${video.titulo}</h3>
                        <div class="video-stats">
                            <span class="video-views"><i class="fas fa-eye"></i> ${video.views} visualizações</span>
                            <span class="video-likes"><i class="fas fa-heart"></i> ${video.likes} likes</span>
                        </div>
                    </div>
                `;
                
                videosGrid.appendChild(videoCard);
            });
            
            updateFavoriteHearts();
            setupFavoriteListeners();
        }

        // Filtrar vídeos por categoria
        function filtrarPorCategoria(categoria) {
            categoriaAtiva = categoria;
            
            // Atualizar botões ativos
            categoriaBtns.forEach(btn => {
                if (btn.dataset.categoria === categoria) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Filtrar vídeos
            let videosFiltrados;
            if (categoria === 'todos') {
                videosFiltrados = videos;
            } else {
                videosFiltrados = videos.filter(video => video.categoria === categoria);
            }
            
            // Aplicar busca também se houver
            const termoBusca = searchInput.value.toLowerCase();
            if (termoBusca) {
                videosFiltrados = videosFiltrados.filter(video => 
                    video.titulo.toLowerCase().includes(termoBusca)
                );
            }
            
            renderVideos(videosFiltrados);
        }

        // Buscar vídeos
        function buscarVideos() {
            const termo = searchInput.value.toLowerCase();
            
            let videosFiltrados;
            if (categoriaAtiva === 'todos') {
                videosFiltrados = videos;
            } else {
                videosFiltrados = videos.filter(video => video.categoria === categoriaAtiva);
            }
            
            if (termo) {
                videosFiltrados = videosFiltrados.filter(video => 
                    video.titulo.toLowerCase().includes(termo)
                );
            }
            
            renderVideos(videosFiltrados);
        }

        // Event listeners para categorias
        categoriaBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filtrarPorCategoria(btn.dataset.categoria);
            });
        });

        // Event listener para busca
        searchInput.addEventListener('input', buscarVideos);

        // Atualiza os corações dos favoritos
        function updateFavoriteHearts() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const favoriteVideos = JSON.parse(localStorage.getItem('favoriteVideos')) || [];
            
            document.querySelectorAll('.favorite-heart').forEach(heart => {
                const videoUrl = heart.getAttribute('data-video-url');
                
                if (isLoggedIn && favoriteVideos.includes(videoUrl)) {
                    heart.classList.add('favorited');
                } else {
                    heart.classList.remove('favorited');
                }
                
                if (!isLoggedIn) {
                    heart.style.opacity = '0';
                } else {
                    heart.style.opacity = '0.7';
                }
            });
        }

        // Adiciona/remove favoritos
        function setupFavoriteListeners() {
            document.querySelectorAll('.favorite-heart').forEach(heart => {
                heart.addEventListener('click', function() {
                    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
                    
                    if (!isLoggedIn) {
                        loginModal.style.display = 'block';
                        return;
                    }
                    
                    const videoUrl = this.getAttribute('data-video-url');
                    let favoriteVideos = JSON.parse(localStorage.getItem('favoriteVideos')) || [];
                    const index = favoriteVideos.indexOf(videoUrl);
                    
                    if (index === -1) {
                        favoriteVideos.push(videoUrl);
                        this.classList.add('favorited');
                    } else {
                        favoriteVideos.splice(index, 1);
                        this.classList.remove('favorited');
                    }
                    
                    localStorage.setItem('favoriteVideos', JSON.stringify(favoriteVideos));
                    
                    // Feedback visual
                    this.style.transform = 'scale(1.3)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 300);
                });
            });
        }

        // Atualiza a data no footer
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('pt-BR');

        // Inicializa a página
        applyTheme();
        checkLoginStatus();
        createNeonCircles();
        renderVideos(videos);

        // Recriar bolinhas quando a janela for redimensionada
        window.addEventListener('resize', createNeonCircles);
    </script>
</body>
</html>
