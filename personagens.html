<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan Superior Web - Personagens</title>
    
        <style>
        /* Adicionando zoom de 110% para todo o documento */
        body {
            zoom: 110%;
            -moz-transform: scale(1.1);
            -moz-transform-origin: 0 0;
        }
        
        /* Para outros navegadores */
        @media all and (-webkit-min-device-pixel-ratio:0) {
            body {
                zoom: 110%;
            }
        }
    </style>

    <!-- Script inline para evitar piscar -->
    <script>
        // Aplica o tema e verifica login imediatamente
        (function() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) document.documentElement.classList.add('dark-mode');
            
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) document.body.classList.add('logged-in');
        })();
    </script>
    
    <style>
        /* === VARIÁVEIS E ESTILOS GLOBAIS COM TEMA NEON === */
        :root {
            --verde: #27ae60;
            --azul: #3498db;
            --vermelho: #e74c3c;
            --amarelo: #f1c40f;
            --texto: #f0f0f0;
            --fundo: #000000;
            --card: #0a0a0a;
            --borda: #222;
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
        }

        .dark-mode {
            --verde: #1e8449;
            --azul: #2980b9;
            --vermelho: #ff6b6b;
            --amarelo: #f39c12;
            --texto: #f0f0f0;
            --fundo: #000000;
            --card: #0a0a0a;
            --borda: #222;
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--fundo);
            color: var(--texto);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animação de bolinhas neon no fundo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: -1;
            pointer-events: none;
        }

        .neon-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.7;
            filter: blur(8px);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translate(30px, -40px) scale(1.1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-20px, 30px) scale(0.9);
                opacity: 0.7;
            }
            75% {
                transform: translate(40px, 20px) scale(1.2);
                opacity: 0.4;
            }
        }

        /* === NAVBAR COM TEMA NEON === */
        .navbar {
            background: rgba(10, 10, 10, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .logo {
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 5px var(--neon-ciano), 0 0 10px var(--neon-ciano);
        }

        .logo small {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: normal;
        }

        #theme-toggle {
            color: var(--neon-ciano);
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        #theme-toggle:hover {
            transform: scale(1.2);
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-ciano);
        }

        .search-bar {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 15px;
            border: 1px solid var(--neon-ciano);
            border-radius: 20px;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--texto);
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .search-bar input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-icon {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .nav-icon:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-ciano);
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: var(--neon-ciano);
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .logout-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        body.logged-in .user-info {
            display: flex;
        }

        body.logged-in .login-btn-nav {
            display: none;
        }

        /* === CONTEÚDO DOS PERSONAGENS COM TEMA NEON === */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .title {
            color: var(--neon-ciano);
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px var(--neon-ciano);
        }

        .subtitle {
            color: var(--neon-azul);
            margin-bottom: 40px;
            font-size: 1.5rem;
            text-shadow: 0 0 5px var(--neon-azul);
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .character-card {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            border: 2px solid var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
            position: relative;
            overflow: hidden;
        }

        .character-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
            z-index: 0;
        }

        @keyframes shine {
            0% {
                left: -50%;
            }
            100% {
                left: 150%;
            }
        }

        .character-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 0 20px var(--neon-ciano), 0 0 40px var(--neon-azul);
        }

        .character-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border: 1px solid var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano);
            position: relative;
            z-index: 1;
        }

        .character-name {
            color: var(--neon-ciano);
            font-size: 1.3rem;
            margin-top: 15px;
            text-shadow: 0 0 5px var(--neon-ciano);
            position: relative;
            z-index: 1;
        }

        /* === MODAL DE LOGIN COM TEMA NEON === */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background-color: var(--card);
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 15px var(--neon-ciano), 0 0 30px var(--neon-azul);
            position: relative;
            border: 1px solid var(--neon-ciano);
        }

        .close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--vermelho);
            text-shadow: 0 0 5px var(--vermelho);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--neon-ciano);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--neon-ciano);
            border-radius: 5px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--texto);
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-ciano);
        }

        .login-btn {
            background: var(--neon-marinho);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 5px var(--neon-marinho);
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: #0066aa;
            box-shadow: 0 0 10px var(--neon-marinho), 0 0 20px var(--neon-azul);
        }

        .switch-form {
            text-align: center;
            margin-top: 15px;
        }

        .switch-btn {
            background: none;
            border: none;
            color: var(--neon-ciano);
            cursor: pointer;
            text-decoration: underline;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .error {
            background-color: rgba(231, 76, 60, 0.2);
            color: var(--vermelho);
            border: 1px solid var(--vermelho);
            box-shadow: 0 0 5px var(--vermelho);
        }

        .success {
            background-color: rgba(39, 174, 96, 0.2);
            color: var(--verde);
            border: 1px solid var(--verde);
            box-shadow: 0 0 5px var(--verde);
        }

        /* === RODAPÉ COM TEMA NEON === */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            background: var(--card);
            border-top: 1px solid var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano);
        }

        /* === RESPONSIVIDADE === */
        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
                padding: 15px;
            }
            .search-bar {
                order: 3;
                width: 100%;
                margin: 15px 0 0 0;
            }
            .characters-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .title {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
        }
    </style>

    <script>
        // === SISTEMA DE LOGIN ===
        const themeToggle = document.getElementById('theme-toggle');
        const loginModal = document.getElementById('loginModal');
        const loginBtnNav = document.getElementById('loginBtnNav');
        const closeBtn = document.querySelector('.close');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginSubmit = document.getElementById('login');
        const registerSubmit = document.getElementById('register');
        const loginMessage = document.getElementById('loginMessage');
        const registerMessage = document.getElementById('registerMessage');
        const logoutBtn = document.getElementById('logoutBtn');
        const userAvatar = document.getElementById('userAvatar');

        // Criar bolinhas neon no fundo
        function createNeonCircles() {
            const colors = ['var(--neon-ciano)', 'var(--neon-azul)', 'var(--neon-marinho)'];
            const body = document.body;
            
            // Remover bolinhas existentes (se houver)
            document.querySelectorAll('.neon-circle').forEach(el => el.remove());
            
            // Criar 15 bolinhas
            for (let i = 0; i < 15; i++) {
                const circle = document.createElement('div');
                circle.classList.add('neon-circle');
                
                // Tamanho aleatório entre 20 e 100px
                const size = Math.random() * 80 + 20;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                
                // Posição aleatória
                circle.style.left = `${Math.random() * 100}vw`;
                circle.style.top = `${Math.random() * 100}vh`;
                
                // Cor aleatória
                circle.style.background = colors[Math.floor(Math.random() * colors.length)];
                circle.style.boxShadow = `0 0 15px ${circle.style.background}, 0 0 30px ${circle.style.background}`;
                
                // Atraso aleatório na animação
                circle.style.animationDelay = `${Math.random() * 5}s`;
                circle.style.animationDuration = `${15 + Math.random() * 10}s`;
                
                body.appendChild(circle);
            }
        }

        // Verifica login ao carregar
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const username = localStorage.getItem('currentUser');
            
            if (isLoggedIn && username) {
                document.body.classList.add('logged-in');
                userAvatar.textContent = username.charAt(0).toUpperCase();
            }
        }

        // Aplica tema
        function applyTheme() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            document.documentElement.classList.toggle('dark-mode', isDark);
            themeToggle.style.color = isDark ? '#f39c12' : '#f1c40f';
        }

        // Controle do tema
        themeToggle.addEventListener('click', () => {
            const isDark = !document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            
            themeToggle.style.transform = 'rotate(360deg) scale(1.2)';
            setTimeout(() => {
                themeToggle.style.transform = '';
            }, 300);
            
            applyTheme();
        });

        // Modal de login
        loginBtnNav.addEventListener('click', () => loginModal.style.display = 'block');
        closeBtn.addEventListener('click', () => loginModal.style.display = 'none');
        window.addEventListener('click', (e) => {
            if (e.target === loginModal) loginModal.style.display = 'none';
        });

        // Alternar entre login/registro
        showRegister.addEventListener('click', () => {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        });
        showLogin.addEventListener('click', () => {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
        });

        // Sistema de registro
        registerSubmit.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showMessage(registerMessage, "As senhas não coincidem!", 'error');
                return;
            }
            
            if (password.length < 4) {
                showMessage(registerMessage, "A senha deve ter pelo menos 4 caracteres!", 'error');
                return;
            }
            
            localStorage.setItem('nathan_username', username);
            localStorage.setItem('nathan_password', password);
            
            showMessage(registerMessage, "Conta criada com sucesso! Faça login.", 'success');
            this.reset();
            
            setTimeout(() => {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
                registerMessage.style.display = 'none';
            }, 2000);
        });

        // Sistema de login
        loginSubmit.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const savedUsername = localStorage.getItem('nathan_username');
            const savedPassword = localStorage.getItem('nathan_password');
            
            if (username === savedUsername && password === savedPassword) {
                showMessage(loginMessage, "Login bem-sucedido!", 'success');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', username);
                
                setTimeout(() => {
                    loginModal.style.display = 'none';
                    checkLoginStatus();
                }, 1000);
            } else {
                showMessage(loginMessage, "Usuário ou senha incorretos!", 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.setItem('isLoggedIn', 'false');
            localStorage.removeItem('currentUser');
            document.body.classList.remove('logged-in');
        });

        // Mostrar mensagens
        function showMessage(element, text, type) {
            element.textContent = text;
            element.style.display = 'block';
            element.className = 'message ' + type;
        }

        // Inicialização
        applyTheme();
        checkLoginStatus();
        createNeonCircles();
        
        // Recriar bolinhas quando a janela for redimensionada
        window.addEventListener('resize', createNeonCircles);
    </script>
</body>
</html>
