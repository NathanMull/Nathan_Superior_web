<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - Nathan Superior Web</title>
    
    <style>
        /* Adicionando zoom de 110% para todo o documento */
        body {
            zoom: 110%;
            -moz-transform: scale(1.1);
            -moz-transform-origin: 0 0;
        }
        
        /* Para outros navegadores */
        @media all and (-webkit-min-device-pixel-ratio:0) {
            body {
                zoom: 110%;
            }
        }
    </style>
    
    <script>
        (function() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
            }
            
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                document.body.classList.add('logged-in');
            }
        })();
    </script>
    
    <style>
        :root {
            --verde: #27ae60;
            --azul: #3498db;
            --vermelho: #e74c3c;
            --amarelo: #f1c40f;
            --texto: #f0f0f0;
            --fundo: #000000;
            --card: #0a0a0a;
            --borda: #222;
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
        }

        .dark-mode {
            --verde: #1e8449;
            --azul: #2980b9;
            --vermelho: #ff6b6b;
            --amarelo: #f39c12;
            --texto: #f0f0f0;
            --fundo: #000000;
            --card: #0a0a0a;
            --borda: #222;
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--fundo);
            color: var(--texto);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animação de bolinhas neon no fundo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: -1;
            pointer-events: none;
        }

        .neon-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.7;
            filter: blur(8px);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translate(30px, -40px) scale(1.1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-20px, 30px) scale(0.9);
                opacity: 0.7;
            }
            75% {
                transform: translate(40px, 20px) scale(1.2);
                opacity: 0.4;
            }
        }

        .navbar {
            background: rgba(10, 10, 10, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .logo {
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 5px var(--neon-ciano), 0 0 10px var(--neon-ciano);
        }

        .logo small {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: normal;
        }

        #theme-toggle {
            color: var(--neon-ciano);
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        #theme-toggle:hover {
            transform: scale(1.2);
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-ciano);
        }

        .search-bar {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 15px;
            border: 1px solid var(--neon-ciano);
            border-radius: 20px;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--texto);
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .search-bar input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .nav-icons {
            display: flex;
            gap: 20px;
        }

        .nav-icon {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .nav-icon:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-ciano);
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--neon-ciano);
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
            position: relative;
            padding-bottom: 15px;
        }

        .page-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano);
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .video-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            border: 1px solid var(--neon-ciano);
            transition: all 0.3s;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 15px var(--neon-ciano);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            cursor: pointer;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .video-card:hover .video-thumbnail img {
            transform: scale(1.05);
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-thumbnail:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            color: white;
            font-size: 3rem;
            text-shadow: 0 0 10px var(--neon-ciano);
            background: rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--neon-ciano);
            box-shadow: 0 0 15px var(--neon-ciano);
        }

        .video-info {
            padding: 20px;
        }

        .video-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--neon-ciano);
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .video-stats {
            font-size: 0.95rem;
            color: var(--texto);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .video-stats i {
            color: var(--neon-marinho);
            text-shadow: 0 0 5px var(--neon-marinho);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--texto);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--neon-ciano);
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-ciano);
        }

        .empty-state p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .login-btn {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid var(--neon-ciano);
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 0 5px var(--neon-ciano), 0 0 10px var(--neon-azul);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
            z-index: 0;
        }

        @keyframes shine {
            0% {
                left: -50%;
            }
            100% {
                left: 150%;
            }
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--neon-ciano), 0 0 30px var(--neon-azul);
        }

        .login-btn i {
            color: var(--neon-ciano);
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: var(--texto);
            opacity: 0.8;
            background: var(--card);
            border-top: 1px solid var(--borda);
            margin-top: 50px;
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: var(--neon-ciano);
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .logout-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        body.logged-in .user-info {
            display: flex;
        }

        body.logged-in .login-btn-nav {
            display: none;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
                padding: 15px;
            }
            .search-bar {
                order: 3;
                width: 100%;
                margin: 15px 0 0 0;
            }
            .videos-grid {
                grid-template-columns: 1fr;
            }
            .page-title {
                font-size: 2rem;
            }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background-color: var(--card);
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 15px var(--neon-ciano), 0 0 30px var(--neon-azul);
            position: relative;
            border: 1px solid var(--neon-ciano);
        }

        .close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--vermelho);
            text-shadow: 0 0 5px var(--vermelho);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--neon-ciano);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--neon-ciano);
            border-radius: 5px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--texto);
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-ciano);
        }

        .modal-btn {
            background: var(--neon-marinho);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 5px var(--neon-marinho);
            transition: all 0.3s;
        }

        .modal-btn:hover {
            background: #0066aa;
            box-shadow: 0 0 10px var(--neon-marinho), 0 0 20px var(--neon-azul);
        }

        .switch-form {
            text-align: center;
            margin-top: 15px;
        }

        .switch-btn {
            background: none;
            border: none;
            color: var(--neon-ciano);
            cursor: pointer;
            text-decoration: underline;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }
        
        .success {
            background-color: rgba(39, 174, 96, 0.2);
            color: var(--verde);
            border: 1px solid var(--verde);
            box-shadow: 0 0 5px var(--verde);
        }
        
        .error {
            background-color: rgba(231, 76, 60, 0.2);
            color: var(--vermelho);
            border: 1px solid var(--vermelho);
            box-shadow: 0 0 5px var(--vermelho);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i id="theme-toggle" class="fas fa-star" title="Mudar tema"></i>
            <span>Nathan Superior Web <small>- Favoritos</small></span>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Pesquise vídeos...">
        </div>
        
        <div class="nav-icons">
            <a href="index.html" class="nav-icon" title="Início">
                <i class="fas fa-home"></i>
            </a>
            <a href="favoritos.html" class="nav-icon" title="Favoritos">
                <i class="fas fa-heart"></i>
            </a>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <button class="logout-btn" id="logoutBtn">Sair</button>
            </div>
            <button class="nav-icon login-btn-nav" id="loginBtnNav" title="Login">
                <i class="fas fa-user"></i>
            </button>
        </div>
    </nav>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            
            <div id="loginForm">
                <h2 style="color: var(--neon-ciano); margin-bottom: 20px; text-align: center; text-shadow: 0 0 5px var(--neon-ciano);">Entrar</h2>
                
                <form id="login">
                    <div class="form-group">
                        <label for="loginUsername"><i class="fas fa-user"></i> Nome de Usuário</label>
                        <input type="text" id="loginUsername" placeholder="Seu nome de usuário" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword"><i class="fas fa-lock"></i> Senha</label>
                        <input type="password" id="loginPassword" placeholder="Sua senha" required>
                    </div>
                    
                    <button type="submit" class="modal-btn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                    
                    <div id="loginMessage" class="status-message" style="display: none;"></div>
                </form>
                
                <div class="switch-form">
                    <span>Não tem uma conta? </span>
                    <button class="switch-btn" id="showRegister">Registre-se</button>
                </div>
            </div>
            
            <div id="registerForm" style="display: none;">
                <h2 style="color: var(--neon-ciano); margin-bottom: 20px; text-align: center; text-shadow: 0 0 5px var(--neon-ciano);">Criar Conta</h2>
                
                <form id="register">
                    <div class="form-group">
                        <label for="registerUsername"><i class="fas fa-user-edit"></i> Nome de Usuário</label>
                        <input type="text" id="registerUsername" placeholder="Escolha um nome de usuário" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="registerPassword"><i class="fas fa-key"></i> Senha</label>
                        <input type="password" id="registerPassword" placeholder="Crie uma senha" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-check-circle"></i> Confirmar Senha</label>
                        <input type="password" id="confirmPassword" placeholder="Digite a senha novamente" required>
                    </div>
                    
                    <button type="submit" class="modal-btn"><i class="fas fa-user-plus"></i> Registrar</button>
                    
                    <div id="registerMessage" class="status-message" style="display: none;"></div>
                </form>
                
                <div class="switch-form">
                    <span>Já tem uma conta? </span>
                    <button class="switch-btn" id="showLogin">Faça login</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h1 class="page-title">Seus Vídeos Favoritos</h1>
        <div class="videos-grid" id="favoritesContainer">
            <!-- Vídeos favoritos renderizados por JavaScript -->
        </div>
    </div>

    <div class="footer">
        <p>Site oficial desenvolvido por Nathan • Todos os direitos reservados • Atualizado em <span id="current-date"></span></p>
    </div>

    <script>
        // Elementos principais
        const themeToggle = document.getElementById('theme-toggle');
        const loginModal = document.getElementById('loginModal');
        const loginBtnNav = document.getElementById('loginBtnNav');
        const closeBtn = document.querySelector('.close');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginSubmit = document.getElementById('login');
        const registerSubmit = document.getElementById('register');
        const loginMessage = document.getElementById('loginMessage');
        const registerMessage = document.getElementById('registerMessage');
        const logoutBtn = document.getElementById('logoutBtn');
        const userAvatar = document.getElementById('userAvatar');
        const favoritesContainer = document.getElementById('favoritesContainer');
        const searchInput = document.querySelector('.search-bar input');

        // Dados dos vídeos com URLs completas
        const videos = {
            'https://youtu.be/iPUQoKibauo?si=kUm2jYNZ-PctDgRS': {
                title: 'Série nova!!! Minecraft elementos o inicio de tudo',
                views: '2.425 visualizações',
                likes: '156 likes'
            },
            'https://youtu.be/FPGAVhG8FoU?si=yhXwaycSj7CS6w1Y': {
                title: 'InsaniaCraft: O MELHOR COMEÇO Produtivo! (EP.1)',
                views: '119 visualizações',
                likes: '12 likes'
            },
            'https://youtu.be/3RMBjtrklD0?si=DOT7YghNw5s4RJWw': {
                title: 'O PORQUÊ EU SAI DA LUNÁTICOS...',
                views: '115 visualizações',
                likes: '15 likes'
            },
            'https://youtu.be/58cKTox-L68?si=WeA-3AjmrD_7mm44': {
                title: 'DESAFIO: VIRAR PREFEITO NO InsaniaCraft EM 24 HORAS! (Será que Consigo?)',
                views: '50 visualizações',
                likes: '9 likes'
            }
        };

        // Função para extrair ID do vídeo da URL
        function getVideoId(url) {
            // Extrai o ID do vídeo de diferentes formatos de URL do YouTube
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?]+)/);
            return match ? match[1] : null;
        }

        // Função para gerar URL da thumbnail
        function getThumbnailUrl(url) {
            const videoId = getVideoId(url);
            if (videoId) {
                return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            }
            return '';
        }

        // Verificar status de login
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const username = localStorage.getItem('currentUser');
            
            if (isLoggedIn && username) {
                document.body.classList.add('logged-in');
                userAvatar.textContent = username.charAt(0).toUpperCase();
            }
        }

        // Alternar tema
        function applyTheme() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            document.documentElement.classList.toggle('dark-mode', isDark);
            themeToggle.style.color = isDark ? '#f39c12' : '#f1c40f';
        }
        
        themeToggle.addEventListener('click', () => {
            const isDark = !document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            
            themeToggle.style.transform = 'rotate(360deg) scale(1.2)';
            setTimeout(() => {
                themeToggle.style.transform = '';
            }, 300);
            
            applyTheme();
        });

        // Modal de login
        loginBtnNav.addEventListener('click', () => {
            loginModal.style.display = 'block';
        });

        closeBtn.addEventListener('click', () => {
            loginModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                loginModal.style.display = 'none';
            }
        });

        // Alternar entre login e registro
        showRegister.addEventListener('click', () => {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        });

        showLogin.addEventListener('click', () => {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
        });

        // Registrar usuário
        registerSubmit.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage(registerMessage, "As senhas não coincidem!", 'error');
                return;
            }

            if (password.length < 4) {
                showMessage(registerMessage, "A senha deve ter pelo menos 4 caracteres!", 'error');
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('usuarios_magicos') || '[]');
            
            if (usuarios.some(u => u.username === username)) {
                showMessage(registerMessage, "Este usuário já existe!", 'error');
                return;
            }
            
            usuarios.push({ username, password });
            localStorage.setItem('usuarios_magicos', JSON.stringify(usuarios));
            
            showMessage(registerMessage, "Conta criada com sucesso!", 'success');
            
            this.reset();
            
            setTimeout(() => {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
                registerMessage.style.display = 'none';
            }, 2000);
        });

        // Login
        loginSubmit.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            const usuarios = JSON.parse(localStorage.getItem('usuarios_magicos') || []);
            const user = usuarios.find(u => u.username === username && u.password === password);
            
            if (user) {
                showMessage(loginMessage, "Login bem-sucedido!", 'success');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', username);
                
                setTimeout(() => {
                    loginModal.style.display = 'none';
                    checkLoginStatus();
                    renderFavorites();
                }, 1000);
            } else {
                showMessage(loginMessage, "Usuário ou senha incorretos!", 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.setItem('isLoggedIn', 'false');
            localStorage.removeItem('currentUser');
            document.body.classList.remove('logged-in');
            renderFavorites();
        });

        // Mostrar mensagens
        function showMessage(element, text, type) {
            element.textContent = text;
            element.style.display = 'block';
            element.className = `status-message ${type}`;
        }

        // Renderizar favoritos
        function renderFavorites() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (!isLoggedIn) {
                favoritesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-lock"></i>
                        <p>Faça login para ver seus favoritos</p>
                        <button class="login-btn" id="emptyStateLoginBtn">
                            <i class="fas fa-sign-in-alt"></i> Fazer Login
                        </button>
                    </div>
                `;
                document.getElementById('emptyStateLoginBtn').addEventListener('click', () => {
                    loginModal.style.display = 'block';
                });
                return;
            }

            const favoritos = JSON.parse(localStorage.getItem('favoriteVideos')) || [];
            if (favoritos.length === 0) {
                favoritesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-heart-broken"></i>
                        <p>Você ainda não favoritou nenhum vídeo</p>
                        <a href="videos.html" class="login-btn">
                            <i class="fas fa-video"></i> Explorar Vídeos
                        </a>
                    </div>
                `;
                return;
            }

            favoritesContainer.innerHTML = '';
            favoritos.forEach(url => {
                const v = videos[url];
                if (!v) return;
                
                const thumbnailUrl = getThumbnailUrl(url);
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-thumbnail" onclick="window.open('${url}', '_blank')">
                        <img src="${thumbnailUrl}" alt="${v.title}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIwIiBoZWlnaHQ9IjE4MCIgdmlld0JveD0iMCAwIDMyMCAxODAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMjAiIGhlaWdodD0iMTgwIiBmaWxsPSIjMEEwQTBBIi8+CjxwYXRoIGQ9Ik0xMjAgOTBMMTQwIDc1VjEwNUwxMjAgOTBaIiBmaWxsPSIjMDBGRkZGIi8+CjxjaXJjbGUgY3g9IjE2MCIgY3k9IjkwIiByPSI0MCIgc3Ryb2tlPSIjMDBGRkZGIiBzdHJva2Utd2lkdGg9IjMiIGZpbGw9Im5vbmUiLz4KPC9zdmc+'">
                        <div class="play-overlay">
                            <div class="play-icon">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-stats">
                            <span><i class="fas fa-eye"></i> ${v.views}</span>
                            <span><i class="fas fa-heart"></i> ${v.likes}</span>
                        </div>
                    </div>
                `;
                favoritesContainer.appendChild(card);
            });
        }

        // Funcionalidade de busca
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.video-card');
            
            cards.forEach(card => {
                const title = card.querySelector('.video-title').textContent.toLowerCase();
                card.style.display = title.includes(term) ? 'block' : 'none';
            });
        });

        // Criar bolinhas neon no fundo
        function createNeonCircles() {
            const colors = ['var(--neon-ciano)', 'var(--neon-azul)', 'var(--neon-marinho)'];
            const body = document.body;
            
            // Remover bolinhas existentes (se houver)
            document.querySelectorAll('.neon-circle').forEach(el => el.remove());
            
            // Criar 15 bolinhas
            for (let i = 0; i < 15; i++) {
                const circle = document.createElement('div');
                circle.classList.add('neon-circle');
                
                // Tamanho aleatório entre 20 e 100px
                const size = Math.random() * 80 + 20;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                
                // Posição aleatória
                circle.style.left = `${Math.random() * 100}vw`;
                circle.style.top = `${Math.random() * 100}vh`;
                
                // Cor aleatória
                circle.style.background = colors[Math.floor(Math.random() * colors.length)];
                circle.style.boxShadow = `0 0 15px ${circle.style.background}, 0 0 30px ${circle.style.background}`;
                
                // Atraso aleatório na animação
                circle.style.animationDelay = `${Math.random() * 5}s`;
                circle.style.animationDuration = `${15 + Math.random() * 10}s`;
                
                body.appendChild(circle);
            }
        }

        // Inicializar
        applyTheme();
        checkLoginStatus();
        renderFavorites();
        createNeonCircles();
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('pt-BR');

        // Recriar bolinhas quando a janela for redimensionada
        window.addEventListener('resize', createNeonCircles);
    </script>
</body>
</html>
