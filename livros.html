<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Nathan Superior Web</title>
    
    <style>
        /* Adicionando zoom de 110% para todo o documento */
        body {
            zoom: 110%;
            -moz-transform: scale(1.1);
            -moz-transform-origin: 0 0;
        }
        
        @media all and (-webkit-min-device-pixel-ratio:0) {
            body {
                zoom: 110%;
            }
        }
    </style>
    
    <script>
        (function() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
            }
            
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                document.body.classList.add('logged-in');
            }
        })();
    </script>
    
    <style>
        :root {
            --verde: #27ae60;
            --azul: #3498db;
            --vermelho: #e74c3c;
            --amarelo: #f1c40f;
            --texto: #f0f0f0;
            --fundo: #000000;
            --card: #0a0a0a;
            --borda: #222;
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
        }

        .dark-mode {
            --verde: #1e8449;
            --azul: #2980b9;
            --vermelho: #ff6b6b;
            --amarelo: #f39c12;
            --texto: #f0f0f0;
            --fundo: #000000;
            --card: #0a0a0a;
            --borda: #222;
            --neon-ciano: #0ff;
            --neon-azul: #00f;
            --neon-marinho: #0077be;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--fundo);
            color: var(--texto);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Bolinhas neon */
        .neon-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.7;
            filter: blur(8px);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            25% { transform: translate(30px, -40px) scale(1.1); opacity: 0.5; }
            50% { transform: translate(-20px, 30px) scale(0.9); opacity: 0.7; }
            75% { transform: translate(40px, 20px) scale(1.2); opacity: 0.4; }
        }

        .navbar {
            background: rgba(10, 10, 10, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--neon-ciano);
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .logo {
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 5px var(--neon-ciano), 0 0 10px var(--neon-ciano);
        }

        .logo small {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: normal;
        }

        #theme-toggle {
            color: var(--neon-ciano);
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        #theme-toggle:hover {
            transform: scale(1.2);
        }

        .search-bar {
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 15px;
            border: 1px solid var(--neon-ciano);
            border-radius: 20px;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--texto);
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .search-bar input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
        }

        .nav-icons {
            display: flex;
            gap: 20px;
        }

        .nav-icon {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        .nav-icon:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 10px var(--neon-ciano);
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: var(--neon-ciano);
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 5px var(--neon-ciano);
        }

        .logout-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--neon-ciano);
        }

        body.logged-in .user-info {
            display: flex;
        }

        body.logged-in .login-btn-nav {
            display: none;
        }

        /* CONTEÚDO DA BIBLIOTECA */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .biblioteca-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .biblioteca-header h1 {
            font-size: 2.5rem;
            color: var(--neon-ciano);
            text-shadow: 0 0 10px var(--neon-ciano), 0 0 20px var(--neon-azul);
            margin-bottom: 10px;
        }

        .biblioteca-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* GRADE 5 LIVROS POR LINHA */
        .livros-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            margin-top: 20px;
        }

        /* CARD DO LIVRO - RETÂNGULO */
        .livro-card {
            background: var(--card);
            border: 2px solid var(--neon-ciano);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        /* ANIMAÇÃO QUE SOBE */
        .livro-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px var(--neon-ciano), 0 0 40px var(--neon-azul);
            border-color: var(--neon-ciano);
        }

        /* CAPA DO LIVRO */
        .livro-capa {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .livro-capa img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .capa-padrao {
            font-size: 80px;
            color: var(--neon-ciano);
            text-shadow: 0 0 20px var(--neon-ciano);
        }

        /* TÍTULO EMBAIXO */
        .livro-titulo {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            color: var(--texto);
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid var(--neon-ciano);
            transition: all 0.3s;
        }

        .livro-card:hover .livro-titulo {
            color: var(--neon-ciano);
            text-shadow: 0 0 5px var(--neon-ciano);
            background: rgba(0, 255, 255, 0.1);
        }

        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            background: var(--card);
            border-top: 1px solid var(--borda);
        }

        /* RESPONSIVO */
        @media (max-width: 1200px) {
            .livros-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 900px) {
            .livros-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            .livros-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 400px) {
            .livros-grid { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i id="theme-toggle" class="fas fa-star" title="Mudar tema"></i>
            <span>Nathan Superior Web <small>- Biblioteca</small></span>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar livros...">
        </div>
        
        <div class="nav-icons">
            <a href="index.html" class="nav-icon" title="Início">
                <i class="fas fa-home"></i>
            </a>
            <a href="favoritos.html" class="nav-icon" title="Favoritos">
                <i class="fas fa-heart"></i>
            </a>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <button class="logout-btn" id="logoutBtn">Sair</button>
            </div>
            <button class="nav-icon login-btn-nav" id="loginBtnNav" title="Login">
                <i class="fas fa-user"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="biblioteca-header">
            <h1><i class="fas fa-book-open"></i> Minha Biblioteca</h1>
            <p>Escolha um livro para começar a aventura!</p>
        </div>
        
        <div class="livros-grid" id="livrosGrid">
            <!-- Os livros aparecem aqui -->
        </div>
    </div>

    <div class="footer">
        <p>Site oficial desenvolvido por Nathan • Todos os direitos reservados • Atualizado regularmente</p>
    </div>

    <script>
        // ========================================
        // LISTA DE LIVROS - COLOQUE SEUS LIVROS AQUI!
        // ========================================
        const livros = [
            {
                id: 1,
                titulo: "Historia Do Canal",
                capa: "",  // Coloque "capa-leon.jpg" se tiver imagem
                link: "historiadoleon1.html",
                disponivel: true
            },
            {
                id: 2,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            },
            {
                id: 3,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            },
            {
                id: 4,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            },
            {
                id: 5,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            },
            {
                id: 6,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            },
            {
                id: 7,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            },
            {
                id: 8,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            },
            {
                id: 9,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            },
            {
                id: 10,
                titulo: "Em Breve...",
                capa: "",
                link: "#",
                disponivel: false
            }
        ];

        // Função para mostrar os livros
        function mostrarLivros(filtro = '') {
            const grid = document.getElementById('livrosGrid');
            grid.innerHTML = '';
            
            const livrosFiltrados = livros.filter(livro => 
                livro.titulo.toLowerCase().includes(filtro.toLowerCase())
            );
            
            livrosFiltrados.forEach(livro => {
                const card = document.createElement('a');
                card.className = 'livro-card';
                
                if (!livro.disponivel) {
                    card.style.cursor = 'not-allowed';
                    card.style.opacity = '0.5';
                    card.href = 'javascript:void(0)';
                } else {
                    card.href = livro.link;
                }
                
                card.innerHTML = `
                    <div class="livro-capa">
                        ${livro.capa ? 
                            `<img src="${livro.capa}" alt="${livro.titulo}">` : 
                            `<div class="capa-padrao"><i class="fas fa-book"></i></div>`
                        }
                    </div>
                    <div class="livro-titulo">
                        ${!livro.disponivel ? '🔜 ' : ''}${livro.titulo}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Pesquisar livros
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            mostrarLivros(e.target.value);
        });

        // Bolinhas neon
        function createNeonCircles() {
            const colors = ['var(--neon-ciano)', 'var(--neon-azul)', 'var(--neon-marinho)'];
            document.querySelectorAll('.neon-circle').forEach(el => el.remove());
            
            for (let i = 0; i < 15; i++) {
                const circle = document.createElement('div');
                circle.classList.add('neon-circle');
                const size = Math.random() * 80 + 20;
                circle.style.width = `${size}px`;
                circle.style.height = `${size}px`;
                circle.style.left = `${Math.random() * 100}vw`;
                circle.style.top = `${Math.random() * 100}vh`;
                circle.style.background = colors[Math.floor(Math.random() * colors.length)];
                circle.style.boxShadow = `0 0 15px ${circle.style.background}, 0 0 30px ${circle.style.background}`;
                circle.style.animationDelay = `${Math.random() * 5}s`;
                circle.style.animationDuration = `${15 + Math.random() * 10}s`;
                document.body.appendChild(circle);
            }
        }

        // Tema
        const themeToggle = document.getElementById('theme-toggle');
        function applyTheme() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            document.documentElement.classList.toggle('dark-mode', isDark);
            themeToggle.style.color = isDark ? '#f39c12' : '#f1c40f';
        }
        
        themeToggle.addEventListener('click', () => {
            const isDark = !document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            applyTheme();
        });

        // Login (igual ao index)
        const loginBtnNav = document.getElementById('loginBtnNav');
        const userAvatar = document.getElementById('userAvatar');
        const logoutBtn = document.getElementById('logoutBtn');
        
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const username = localStorage.getItem('currentUser');
            if (isLoggedIn && username) {
                document.body.classList.add('logged-in');
                userAvatar.textContent = username.charAt(0).toUpperCase();
            }
        }
        
        logoutBtn.addEventListener('click', () => {
            localStorage.setItem('isLoggedIn', 'false');
            localStorage.removeItem('currentUser');
            document.body.classList.remove('logged-in');
            window.location.reload();
        });
        
        loginBtnNav.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // Inicializar
        applyTheme();
        checkLoginStatus();
        mostrarLivros();
        window.addEventListener('load', createNeonCircles);
        window.addEventListener('resize', createNeonCircles);
    </script>
</body>
</html>
